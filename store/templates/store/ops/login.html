{% extends "store/base.html" %}
{% block meta %}<meta name="robots" content="noindex,nofollow">{% endblock %}
{% block seo %}{% endblock %}
{% block title %}OPS // Sign in{% endblock %}
{% block body %}
<main class="min-h-screen grid place-items-center px-4">
  <form method="post" class="w-full max-w-sm border-2 border-bone bg-coal shadow-[6px_6px_0_0_#e5322d]">
    {% csrf_token %}
    <div class="border-b-2 border-bone px-4 py-2 text-xs uppercase tracking-[0.3em] text-blood">OPS // Restricted</div>
    <div class="p-4 space-y-4">
      <h1 class="font-gothic text-4xl">CLBR</h1>
      {% if form.errors %}<p class="border-2 border-blood text-blood px-3 py-2 text-sm" role="alert">Invalid credentials or not authorised.</p>{% endif %}
      <div>
        <label for="id_username" class="block text-[11px] uppercase tracking-[0.2em] text-bone/60 mb-1">Username</label>
        <input id="id_username" name="username" type="text" autocomplete="username" required autofocus
               class="w-full bg-ink border-2 border-bone/40 focus:border-blood outline-none px-3 py-2">
      </div>
      <div>
        <label for="id_password" class="block text-[11px] uppercase tracking-[0.2em] text-bone/60 mb-1">Password</label>
        <input id="id_password" name="password" type="password" autocomplete="current-password" required
               class="w-full bg-ink border-2 border-bone/40 focus:border-blood outline-none px-3 py-2">
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="w-full bg-blood text-ink px-3 py-3 uppercase tracking-[0.25em] font-bold border-2 border-blood hover:bg-ink hover:text-blood">[ Enter ]</button>
    </div>
  </form>
</main>
{% endblock %}
