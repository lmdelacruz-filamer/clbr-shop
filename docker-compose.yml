services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # cache only, nothing to persist

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    expose:
      - "8000"            # internal only; never published to the internet

  # Returns stock held by unverified orders after ORDER_HOLD_HOURS (runs every 10 min)
  cron:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - web
      - redis
    entrypoint: []
    command: ["sh", "-c", "while true; do sleep 600; python manage.py release_expired_orders; done"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - caddy_data:/data          # TLS certificates
      - caddy_config:/config

volumes:
  pgdata:
  static_data:
  media_data:
  caddy_data:
  caddy_config:
